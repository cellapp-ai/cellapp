name: cellapp-selfhost
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    env_file: ./selfhost.local/runtime.env
    environment:
      POSTGRES_USER: cellapp_admin
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U cellapp_admin -d postgres']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  database-init:
    image: postgres:17.6-alpine
    env_file: ./selfhost.local/runtime.env
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ./selfhost-db-init.sh:/init.sh:ro
      - ../apps/server/appdata/bootstrap.sql:/bootstrap-appdata.sql:ro
    entrypoint: [sh, /init.sh]
    networks: [private]
    restart: "no"

  rustfs-certs-init:
    image: alpine:3.22
    volumes:
      - ./selfhost.local/rustfs-certs:/source:ro
      - rustfs-certs:/certs
    entrypoint: [sh, -ec]
    command: ['cp /source/rustfs_cert.pem /certs/rustfs_cert.pem; cp /source/rustfs_key.pem /certs/rustfs_key.pem; chown -R 10001:10001 /certs; chmod 0500 /certs; chmod 0400 /certs/rustfs_key.pem; chmod 0444 /certs/rustfs_cert.pem']
    networks: [private]
    restart: "no"

  rustfs:
    image: rustfs/rustfs:1.0.3
    restart: unless-stopped
    env_file: ./selfhost.local/runtime.env
    environment:
      RUSTFS_TLS_PATH: /certs
    depends_on:
      rustfs-certs-init: {condition: service_completed_successfully}
    volumes:
      - rustfs:/data
      - rustfs-certs:/certs:ro
    networks: [private]

  rustfs-init:
    image: rustfs/rc:v0.1.36
    env_file: ./selfhost.local/runtime.env
    environment:
      S3_CA_BUNDLE: /run/selfhost/rustfs-ca.crt
    depends_on: [rustfs]
    volumes:
      - ./rustfs-init.sh:/init.sh:ro
      - ./selfhost.local/rustfs-ca.crt:/run/selfhost/rustfs-ca.crt:ro
    entrypoint: [sh, /init.sh]
    networks: [private]
    restart: "no"

  migrate:
    image: ${CELLAPP_IMAGE:-cellapp:selfhost}
    build: {context: .., dockerfile: Dockerfile}
    env_file: ./selfhost.local/runtime.env
    entrypoint: [cellapp-server, -migrate]
    depends_on:
      database-init: {condition: service_completed_successfully}
    networks: [private]
    restart: "no"

  app:
    image: ${CELLAPP_IMAGE:-cellapp:selfhost}
    build: {context: .., dockerfile: Dockerfile}
    entrypoint: [/usr/local/bin/selfhost-entrypoint]
    restart: unless-stopped
    env_file: ./selfhost.local/runtime.env
    environment:
      SELFHOST_CA_CERT: /run/selfhost/rustfs-ca.crt
    volumes:
      - ./selfhost.local/rustfs-ca.crt:/run/selfhost/rustfs-ca.crt:ro
    depends_on:
      migrate: {condition: service_completed_successfully}
      rustfs-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, /usr/local/bin/cellapp-healthcheck]
      interval: 5s
      timeout: 4s
      retries: 24
    networks: [private]

  ingress:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./selfhost.local/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./selfhost.local/control.crt:/etc/caddy/control.crt:ro
      - ./selfhost.local/control.key:/etc/caddy/control.key:ro
      - ./selfhost.local/apps.crt:/etc/caddy/apps.crt:ro
      - ./selfhost.local/apps.key:/etc/caddy/apps.key:ro
    depends_on:
      app: {condition: service_healthy}
    networks: [private]

volumes:
  postgres:
  rustfs:
  rustfs-certs:
networks:
  private:
    driver: bridge
