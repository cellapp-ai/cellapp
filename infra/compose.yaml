services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cellapp
      POSTGRES_PASSWORD: development
      POSTGRES_DB: cellapp
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./postgres-init-appdata.sh:/docker-entrypoint-initdb.d/10-appdata.sh:ro
      - ../apps/server/appdata/bootstrap.sql:/bootstrap-appdata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellapp"]
      interval: 3s
      retries: 20
  proxy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
  postgrest:
    image: docker.1ms.run/postgrest/postgrest:v16.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://cellapp_appdata_authenticator:development@postgres:5432/cellapp_data
      PGRST_DB_SCHEMAS: cellapp_api
      PGRST_DB_PRE_CONFIG: cellapp_internal.pre_config
      PGRST_DB_ANON_ROLE: cellapp_appdata_anon
      PGRST_JWT_SECRET: local-development-postgrest-jwt-secret-32-bytes
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_POOL: 10
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_PRE_REQUEST: cellapp_internal.pre_request
    ports: ["127.0.0.1:3001:3000"]
  rustfs:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: cellapp-local
      RUSTFS_SECRET_KEY: cellapp-local-development-only
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["rustfs:/data"]
  rustfs-init:
    image: rustfs/rc:v0.1.36
    depends_on: ["rustfs"]
    environment:
      S3_ENDPOINT: http://rustfs:9000
      S3_BUCKET: cellapp
      S3_ACCESS_KEY_ID: cellapp-local
      S3_SECRET_ACCESS_KEY: cellapp-local-development-only
    volumes: ["./rustfs-init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
volumes:
  postgres:
  caddy:
  rustfs:
