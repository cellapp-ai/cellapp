services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: cellapp
      POSTGRES_PASSWORD: development
      POSTGRES_DB: cellapp
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cellapp"]
      interval: 3s
      retries: 20
  proxy:
    image: caddy:2.10.2-alpine
    ports: ["127.0.0.1:8443:8443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cellapp-local
      MINIO_ROOT_PASSWORD: cellapp-local-development-only
      MINIO_REGION_NAME: us-east-1
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: ["minio"]
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: cellapp
      S3_ACCESS_KEY_ID: cellapp-local
      S3_SECRET_ACCESS_KEY: cellapp-local-development-only
    volumes: ["./minio-init.sh:/init.sh:ro"]
    entrypoint: ["/bin/sh", "/init.sh"]
volumes:
  postgres:
  caddy:
  minio:
